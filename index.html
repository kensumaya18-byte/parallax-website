<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO: description shown in Google results -->
    <meta name="description" content="A parallax scrolling demo page built with HTML and CSS.">

    <!-- SEO: keywords (minor ranking factor, mostly legacy) -->
    <meta name="keywords" content="parallax, html, css, web design">

    <!-- Author info -->
    <meta name="author" content="Thirdy Ugh">

    <!-- Page title (this is what shows in the tab + Google) -->
    <title>Parallax Web Page</title>

    <!-- Favicon (modern format) -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- Open Graph: how your link looks when shared on Facebook/LinkedIn -->
    <meta property="og:title" content="Parallax Web Page">
    <meta property="og:description" content="A parallax scrolling demo.">
    <meta property="og:image" content="preview.jpg">
    <meta property="og:type" content="website">

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image">

    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/parallax.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variable.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

</head>

</body>

</html>
